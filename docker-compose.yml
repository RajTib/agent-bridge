# docker compose up -d --build
# Reads secrets/config from .env (see .env.example). The dashboard is published
# on 127.0.0.1 only; expose it to the internet only through an HTTPS tunnel.
services:
  agentbridge:
    build: .
    image: agentbridge:local
    restart: unless-stopped
    env_file: .env
    environment:
      AGENTBRIDGE_HOST: 0.0.0.0
      AGENTBRIDGE_DATA_DIR: /data
    ports:
      - '127.0.0.1:${AGENTBRIDGE_PORT:-4317}:4317'
    volumes:
      # SQLite DB + generated secrets. The host hook reads ./data/hook-token when you
      # set AGENTBRIDGE_DATA_DIR=<repo>/data in the shell that launches Claude Code
      # (or set AGENTBRIDGE_HOOK_TOKEN in both places).
      - ./data:/data
